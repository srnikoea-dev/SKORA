name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          # Jangan minta paket 'tools' yang sudah dihapus
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Check project structure
        run: |
          echo "=== Isi root ==="
          ls -la
          echo ""
          echo "=== Cek gradlew ==="
          ls -la gradlew 2>/dev/null || echo "❌ gradlew TIDAK ADA"
          echo ""
          echo "=== Cek folder app ==="
          ls -la app 2>/dev/null || echo "❌ folder app TIDAK ADA"

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            echo "❌ Project Android belum lengkap."
            echo "Upload source code lengkap dulu (harus ada file gradlew)."
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
